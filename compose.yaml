services:
  web:
    build: .
    ports: ["8080:80"]
    environment:
      DATABASE_URL: "pgsql:host=db;port=5432;dbname=scouting"
      DB_USER: scouting
      DB_PASSWORD: scouting_local
    depends_on:
      db: {condition: service_healthy}
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: scouting
      POSTGRES_USER: scouting
      POSTGRES_PASSWORD: scouting_local
    volumes: ["scouting_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scouting"]
      interval: 3s
      retries: 20
volumes:
  scouting_data:
